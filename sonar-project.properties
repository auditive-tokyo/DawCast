sonar.projectKey=auditive-tokyo_DawCast
sonar.organization=auditive-tokyo

sonar.sources=Source
sonar.tests=Tests
sonar.test.inclusions=Tests/**

# UT 未整備のため Source 配下全体をカバレッジ集計から除外
sonar.coverage.exclusions=Source/**

# C++ として解析（.h も C++ 扱い）
# sonar.cfamily.compile-commands は CI ワークフロー側で --define により指定
sonar.c.file.suffixes=.c
sonar.cpp.file.suffixes=.cpp,.h,.mm
